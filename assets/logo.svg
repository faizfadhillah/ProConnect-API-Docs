<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ProConnect">
  <defs>
    <linearGradient id="pcGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E5EFF"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pcRing" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#1E5EFF"/>
    </linearGradient>
  </defs>
  <!-- rounded square plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pcGrad)"/>
  <!-- "connection" arc - two nodes joined -->
  <circle cx="22" cy="22" r="6" fill="#fff"/>
  <circle cx="42" cy="42" r="6" fill="#fff"/>
  <path d="M22 28 C 22 40, 30 42, 42 42 M22 22 C 34 22, 42 30, 42 42"
        stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- subtle inner stroke -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
</svg>
