name: Sync API Documentation

on:
  schedule:
    - cron: '0 */6 * * *'    # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button
  repository_dispatch:        # external trigger (e.g. ProConnect API repo on deploy)
    types: [api-updated]

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch live OpenAPI spec and regenerate docs
        run: npm run generate-docs

      - name: Check for documentation changes
        id: git-check
        run: |
          git diff --exit-code docs/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit regenerated docs
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git commit -m "docs: auto-sync API documentation $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
